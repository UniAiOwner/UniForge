[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unimemory"
version = "2026.1.0"
description = "UniMemory: Sovereign Cognitive Memory Substrate, 5-Tier Living Memory Engine, Bi-Temporal Knowledge Graph & Sub-millisecond FTS5 Recall"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Shoeb Ahmad", email = "founder@uniai.local" }
]
license = { text = "MIT" }
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
]

[project.scripts]
unimemory = "unimemory.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
