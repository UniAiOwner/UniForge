[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uniwatch"
version = "2026.1.0"
description = "UniWatch: Sovereign Filesystem Inotify Compiler & Syntax Watchdog"
authors = [
    { name = "Shoeb Ahmad (Founder)", email = "shoeb@uniai.internal" },
    { name = "Antigravity (AI Co-Architect)", email = "antigravity@uniai.internal" }
]
license = { text = "Proprietary / Sovereign UniAi License" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "univerify>=2026.1.0",
    "unimemory>=2026.1.0",
    "unibus>=2026.1.0",
]

[project.scripts]
uniwatch = "uniwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
