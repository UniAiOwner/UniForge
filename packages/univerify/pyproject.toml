[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "univerify"
version = "2026.1.0"
description = "UniVerify: Sovereign Invariant, Formal Proof & Deterministic Verification Gate for UniCortex Cognitive Architecture"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Shoeb Ahmad", email = "founder@uniai.local" }
]
license = { text = "MIT" }
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
]

[project.scripts]
univerify = "univerify.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
