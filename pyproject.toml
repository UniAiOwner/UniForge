[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uniforge"
version = "1.0.0"
description = "Sovereign Autonomous Developer Suite & Engineering Machine"
authors = [{ name = "Shoeb Ahmad", email = "uniaiowner@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
uniforge = "uniforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
